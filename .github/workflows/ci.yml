name: AdPilot CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Unit tests & package
        run: mvn -B -ntp clean verify
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install
        run: npm install --no-audit --no-fund
        working-directory: frontend
      - name: Dashboard tests
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          ADPILOT_ADMIN_USERNAME: admin
          ADPILOT_ADMIN_PASSWORD: ci-placeholder-password-123
  smoke:
    name: Compose startup smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated test environment
        run: |
          cat > .env <<'ENV'
          DB_NAME=adpilot
          DB_USER=adpilot
          DB_PASSWORD=ci-local-postgres-password
          ADPILOT_ADMIN_USERNAME=admin
          ADPILOT_ADMIN_PASSWORD=ci-local-admin-password-123
          META_GRAPH_VERSION=v26.0
          META_AD_ACCOUNT_ID=
          META_ACCESS_TOKEN=
          ENV
      - name: Start all containers with health checks
        run: docker compose up --build --wait --wait-timeout 240 -d
      - name: Verify health and authenticated endpoints
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:18080/actuator/health | grep -q '"status":"UP"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/v1/meta/status)" = "401"
          curl --fail --silent --show-error -u admin:ci-local-admin-password-123 http://127.0.0.1:18080/api/v1/meta/status | grep -q 'NOT_CONFIGURED'
          curl --fail --silent --show-error -u admin:ci-local-admin-password-123 http://127.0.0.1:18080/api/v1/nuvemshop/status | grep -q 'NOT_CONFIGURED'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/v1/nuvemshop/products)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/v1/nuvemshop/oauth/callback)" = "503"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:13000/)" = "401"
          curl --fail --silent --show-error -u admin:ci-local-admin-password-123 http://127.0.0.1:13000/ | grep -q 'Painel de desempenho'
          # PR 018: render the read-only, historically sourced recommendation in the home dashboard.
          curl --fail --silent --show-error -u admin:ci-local-admin-password-123 \
            'http://127.0.0.1:13000/?since=2026-10-14&until=2026-10-20' \
            -o /tmp/adpilot-pr018-home.html
          grep -Fq 'O que fazer agora?' /tmp/adpilot-pr018-home.html
          grep -Fq 'Recomendações' /tmp/adpilot-pr018-home.html
          grep -Fq 'Fonte: histórico local' /tmp/adpilot-pr018-home.html
          grep -Fq 'Diagnósticos e auditorias' /tmp/adpilot-pr018-home.html
          grep -Fq 'Histórico de campanhas ainda indisponível' /tmp/adpilot-pr018-home.html
          # PR 019: calculator is an authenticated client-side planner with no backend writes.
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            'http://127.0.0.1:13000/calculadora')" = "401"
          curl --fail --silent --show-error -u admin:ci-local-admin-password-123 \
            'http://127.0.0.1:13000/calculadora' -o /tmp/adpilot-pr019-calculator.html
          grep -Fq 'Calculadora de CPA e ROAS' /tmp/adpilot-pr019-calculator.html
          grep -Fq 'Custo da mercadoria' /tmp/adpilot-pr019-calculator.html
          grep -Fq 'Lucro desejado por venda' /tmp/adpilot-pr019-calculator.html
          # PR 019.2: the profit is entered as a percentage, not as a money field.
          grep -Fq 'Lucro desejado calculado' /tmp/adpilot-pr019-calculator.html
          grep -Fq 'calc-desiredProfitPercent' /tmp/adpilot-pr019-calculator.html
          grep -Fq 'Metas calculadas' /tmp/adpilot-pr019-calculator.html
          # PR 019.1: explicit zero costs and computed pre-ad result are visible.
          grep -Fq 'Preencha' /tmp/adpilot-pr019-calculator.html
          grep -Fq 'Todos obrigatórios' /tmp/adpilot-pr019-calculator.html
          grep -Fq 'Resultado da venda antes dos anúncios' /tmp/adpilot-pr019-calculator.html
          grep -Fq 'Restaurar valores iniciais' /tmp/adpilot-pr019-calculator.html

          grep -Fq 'Planejar campanha' /tmp/adpilot-pr018-home.html


          curl --fail --silent --show-error -u admin:ci-local-admin-password-123 http://127.0.0.1:18080/api/v1/analytics/status | grep -q '"syncEnabled":false'
          # Execute historical SQL including per-campaign LATERAL aggregate against real PostgreSQL.
          curl --fail --silent --show-error -u admin:ci-local-admin-password-123 \
            'http://127.0.0.1:18080/api/v1/analytics/history?since=2026-10-01&until=2026-10-20' \
            | grep -q '"campaigns":\[\]'
          # PR 020: V5 does not retroactively invent collection coverage.
          curl --fail --silent --show-error -u admin:ci-local-admin-password-123 \
            'http://127.0.0.1:18080/api/v1/analytics/history?since=2026-10-14&until=2026-10-20' \
            -o /tmp/adpilot-pr020-history-before.json
          jq -e '.complete==false and .coverage.meta.status=="NO_COLLECTION_RECEIPT"
            and .coverage.meta.observedDays==0 and (.coverage.meta.unobservedDates|length)==7
            and .coverage.store.status=="UPDATED_AT_ONLY_NOT_PAID_DATE"' \
            /tmp/adpilot-pr020-history-before.json
          # Isolated CI fixture: one successful 3-day Meta API window, one failed window.
          # Only the successful receipt must count; empty rows are NOT assumed to be zero sales.
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U adpilot -d adpilot <<'SQL'
          WITH ok_run AS (
            INSERT INTO analytics_sync_run
              (workspace_id,provider,resource,status,finished_at)
            VALUES ('00000000-0000-4000-8000-000000000001',
              'META_ADS','INSIGHTS_DAILY','SUCCEEDED',now())
            RETURNING id
          )
          INSERT INTO analytics_sync_window
            (run_id,workspace_id,provider,resource,account_id,meta_from,meta_through)
          SELECT id,'00000000-0000-4000-8000-000000000001',
            'META_ADS','INSIGHTS_DAILY','123456','2026-10-14','2026-10-16'
          FROM ok_run;
          WITH bad_run AS (
            INSERT INTO analytics_sync_run
              (workspace_id,provider,resource,status,finished_at,error_code)
            VALUES ('00000000-0000-4000-8000-000000000001',
              'META_ADS','INSIGHTS_DAILY','FAILED',now(),'CI_FAKE_ERROR')
            RETURNING id
          )
          INSERT INTO analytics_sync_window
            (run_id,workspace_id,provider,resource,account_id,meta_from,meta_through)
          SELECT id,'00000000-0000-4000-8000-000000000001',
            'META_ADS','INSIGHTS_DAILY','123456','2026-10-17','2026-10-20'
          FROM bad_run;
          SQL
          curl --fail --silent --show-error -u admin:ci-local-admin-password-123 \
            'http://127.0.0.1:18080/api/v1/analytics/history?since=2026-10-14&until=2026-10-20' \
            -o /tmp/adpilot-pr020-history-after.json
          jq -e '.complete==false and .coverage.meta.status=="PARTIAL_WINDOWS"
            and .coverage.meta.observedDays==3 and .coverage.meta.datesWithoutRows==3
            and (.coverage.meta.unobservedDates|length)==4
            and (.coverage.meta.observedWithoutRows|length)==3
            and (.warnings|index("META_FETCHED_DAYS_WITHOUT_REPORTED_ROWS")!=null)' \
            /tmp/adpilot-pr020-history-after.json
          curl --fail --silent --show-error -u admin:ci-local-admin-password-123 \
            'http://127.0.0.1:13000/historico?since=2026-10-14&until=2026-10-20' \
            -o /tmp/adpilot-pr020-history-ui.html
          grep -Fq 'O quanto do período foi consultado?' /tmp/adpilot-pr020-history-ui.html
          grep -Fq 'Dias sem consulta comprovada' /tmp/adpilot-pr020-history-ui.html
          # PR 017: preview is read-only and never pretends an empty period has zero purchases.
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            'http://127.0.0.1:18080/api/v1/analytics/recommendations?since=2026-10-14&until=2026-10-20')" = "401"
          curl --fail --silent --show-error -u admin:ci-local-admin-password-123 \
            'http://127.0.0.1:18080/api/v1/analytics/recommendations?since=2026-10-14&until=2026-10-20' \
            | grep -q '"NO_META_INSIGHTS"'
          # A canonical decimal target must reach the Java API as a real goal.
          curl --fail --silent --show-error -u admin:ci-local-admin-password-123 \
            'http://127.0.0.1:18080/api/v1/analytics/recommendations?since=2026-10-14&until=2026-10-20&targetRoas=3.4&targetCpa=75' \
            | grep -q '"targetRoas":3.4'

          test "$(docker compose exec -T postgres psql -U adpilot -d adpilot -tAc \
            'SELECT count(*) FROM analytics_recommendation_evaluation')" = "0"
          curl --fail --silent --show-error -u admin:ci-local-admin-password-123 \
            -H 'Content-Type: application/json' \
            --data '{"since":"2026-10-14","until":"2026-10-20","targetRoas":3,"targetCpa":50}' \
            'http://127.0.0.1:18080/api/v1/analytics/recommendations/evaluations' \
            | grep -q '"evaluationId"'
          test "$(docker compose exec -T postgres psql -U adpilot -d adpilot -tAc \
            'SELECT count(*) FROM analytics_recommendation_evaluation')" = "1"
          test "$(docker compose exec -T postgres psql -U adpilot -d adpilot -tAc \
            'SELECT count(*) FROM analytics_recommendation')" = "1"
          test "$(docker compose exec -T postgres psql -U adpilot -d adpilot -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='analytics_recommendation_evaluation'")" = "1"
          test "$(curl -s -o /dev/null -w '%{http_code}' -u admin:ci-local-admin-password-123 -X POST http://127.0.0.1:18080/api/v1/analytics/sync)" = "409"
          test "$(docker compose exec -T postgres psql -U adpilot -d adpilot -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('analytics_sync_state','analytics_sync_run','analytics_order_snapshot','analytics_meta_insight_daily','analytics_audience_definition','analytics_recommendation','analytics_recommendation_evidence','analytics_meta_campaign_snapshot')")" = "8"
          # PR 021: a real PostgreSQL snapshot without full V5 receipts
          # must never generate ROAS/CPA investigative recommendations.
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U adpilot -d adpilot <<'SQL'
          INSERT INTO analytics_meta_insight_daily
            (workspace_id,account_id,campaign_id,insight_day,spend,impressions,clicks,
             attributed_purchases,attributed_revenue,currency)
          SELECT '00000000-0000-4000-8000-000000000001', '123456','52596120828588',
                 day::date,100,1000,100,1,150,'BRL'
          FROM generate_series('2026-10-14'::date,'2026-10-20'::date,interval '1 day') AS day;
          SQL
          curl --fail --silent --show-error -u admin:ci-local-admin-password-123 \
            'http://127.0.0.1:18080/api/v1/analytics/recommendations?since=2026-10-14&until=2026-10-20&targetRoas=3&targetCpa=50' \
            -o /tmp/adpilot-pr021-rec.json
          jq -e '.coverageVerified==false and .quality.status=="PARTIAL_WINDOWS"
            and .quality.collectedDays==3 and .quality.analysisEligible==false
            and (.warnings|index("RECOMMENDATIONS_DATA_QUALITY_LIMITED")!=null)
            and (.recommendations|map(.ruleCode)|index("DATA_QUALITY_LIMITED")!=null)
            and (.recommendations|map(.ruleCode)|index("ROAS_BELOW_TARGET")==null)
            and (.recommendations|map(.ruleCode)|index("CPA_ABOVE_TARGET")==null)
            and (.recommendations|map(.actionCode)|all(.=="REVIEW_DATA"))' \
            /tmp/adpilot-pr021-rec.json
          curl --fail --silent --show-error -u admin:ci-local-admin-password-123 \
            'http://127.0.0.1:13000/recomendacoes?since=2026-10-14&until=2026-10-20&targetRoas=3&targetCpa=50' \
            -o /tmp/adpilot-pr021-rec.html
          grep -Fq 'Qualidade dos dados usados na análise' /tmp/adpilot-pr021-rec.html
          grep -Fq 'Verificar qualidade dos dados antes de decidir' /tmp/adpilot-pr021-rec.html
          grep -Fq 'Dias consultados' /tmp/adpilot-pr021-rec.html



      - name: Collect Docker diagnostics on failure
        if: failure()
        run: docker compose ps && docker compose logs --tail=120
      - name: Tear down test containers
        if: always()
        run: docker compose down -v --remove-orphans
