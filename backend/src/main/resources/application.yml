spring:
  application:
    name: adpilot-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/adpilot}
    username: ${SPRING_DATASOURCE_USERNAME:adpilot}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
server:
  port: 8080
adpilot:
  admin:
    username: ${ADPILOT_ADMIN_USERNAME:}
    password: ${ADPILOT_ADMIN_PASSWORD:}
  meta:
    version: ${META_GRAPH_VERSION:v26.0}
    account-id: ${META_AD_ACCOUNT_ID:}
    access-token: ${META_ACCESS_TOKEN:}
  nuvemshop:
    client-id: ${NUVEMSHOP_CLIENT_ID:}
    client-secret: ${NUVEMSHOP_CLIENT_SECRET:}
    redirect-uri: ${NUVEMSHOP_REDIRECT_URI:}
    user-agent: ${NUVEMSHOP_USER_AGENT:}
    encryption-key: ${NUVEMSHOP_ENCRYPTION_KEY:}
    api-base: ${NUVEMSHOP_API_BASE:https://api.nuvemshop.com.br}
    api-version: ${NUVEMSHOP_API_VERSION:2025-03}
    oauth-base: ${NUVEMSHOP_OAUTH_BASE:https://www.nuvemshop.com.br}
    token-url: ${NUVEMSHOP_TOKEN_URL:https://www.tiendanube.com/apps/authorize/token}
    dashboard-url: ${NUVEMSHOP_DASHBOARD_URL:http://localhost:13000/}
    payment-diagnostics-enabled: ${ADPILOT_NUVEMSHOP_DIAGNOSTICS_ENABLED:false}
  analytics:
    sync-enabled: ${ADPILOT_ANALYTICS_SYNC_ENABLED:false}
    sync-cron: ${ADPILOT_ANALYTICS_SYNC_CRON:0 5 */3 * * *}
