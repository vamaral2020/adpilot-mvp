name: adpilot
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?copy .env.example para .env}
      POSTGRES_USER: ${DB_USER:?configurar DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?configurar DB_PASSWORD}
    volumes:
      - adpilot_pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:15432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: {context: ./backend}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      ADPILOT_ADMIN_USERNAME: ${ADPILOT_ADMIN_USERNAME:?configure login}
      ADPILOT_ADMIN_PASSWORD: ${ADPILOT_ADMIN_PASSWORD:?configure senha}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v26.0}
      META_AD_ACCOUNT_ID: ${META_AD_ACCOUNT_ID:-}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      NUVEMSHOP_CLIENT_ID: ${NUVEMSHOP_CLIENT_ID:-}
      NUVEMSHOP_CLIENT_SECRET: ${NUVEMSHOP_CLIENT_SECRET:-}
      NUVEMSHOP_REDIRECT_URI: ${NUVEMSHOP_REDIRECT_URI:-}
      NUVEMSHOP_USER_AGENT: ${NUVEMSHOP_USER_AGENT:-}
      NUVEMSHOP_ENCRYPTION_KEY: ${NUVEMSHOP_ENCRYPTION_KEY:-}
      NUVEMSHOP_API_BASE: ${NUVEMSHOP_API_BASE:-https://api.nuvemshop.com.br}
      NUVEMSHOP_API_VERSION: ${NUVEMSHOP_API_VERSION:-2025-03}
      NUVEMSHOP_OAUTH_BASE: ${NUVEMSHOP_OAUTH_BASE:-https://www.nuvemshop.com.br}
      NUVEMSHOP_TOKEN_URL: ${NUVEMSHOP_TOKEN_URL:-https://www.tiendanube.com/apps/authorize/token}
      NUVEMSHOP_DASHBOARD_URL: ${NUVEMSHOP_DASHBOARD_URL:-http://localhost:13000/}
      ADPILOT_NUVEMSHOP_DIAGNOSTICS_ENABLED: ${ADPILOT_NUVEMSHOP_DIAGNOSTICS_ENABLED:-false}
    ports: ['127.0.0.1:18080:8080']
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ['CMD-SHELL','wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
  web:
    build: {context: ./frontend}
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://api:8080
      ADPILOT_ADMIN_USERNAME: ${ADPILOT_ADMIN_USERNAME}
      ADPILOT_ADMIN_PASSWORD: ${ADPILOT_ADMIN_PASSWORD}
      PORT: '3000'
      HOSTNAME: 0.0.0.0
    ports: ['127.0.0.1:13000:3000']
    depends_on: {api: {condition: service_healthy}}
volumes:
  adpilot_pgdata:
